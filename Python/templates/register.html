{% extends 'base.html' %}

{% block title %}Create Account – ResumeAI{% endblock %}

{% block body_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card-saas p-4 p-md-5 rounded-4 shadow-lg" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-4">
      <a class="d-inline-flex align-items-center gap-2 fw-bold text-decoration-none text-main mb-2" href="{{ url_for('index') }}">
        <div class="rounded-3 bg-primary text-white d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <span class="fs-4">Resume<span class="text-primary">AI</span></span>
      </a>
      <h4 class="fw-bold mt-2">Create Your Account</h4>
      <p class="text-muted small">Start crafting job-winning resumes powered by artificial intelligence.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
          <input type="text" name="name" class="form-control border-start-0" placeholder="John Doe" value="{{ name or '' }}" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" name="email" class="form-control border-start-0" placeholder="name@company.com" value="{{ email or '' }}" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="password" class="form-control border-start-0" placeholder="At least 6 characters" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="confirm_password" class="form-control border-start-0" placeholder="Repeat your password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
        <i class="fa-solid fa-user-plus me-2"></i> Register Free
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top small text-muted">
      Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
